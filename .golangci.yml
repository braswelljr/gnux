version: "2"

linters:
  # Start from the default set and add extras.
  # golangci-lint enables errcheck, govet, ineffassign, staticcheck, unused by default.
  enable:
    - misspell       # catch typos in strings and comments
    - unconvert      # remove unnecessary type conversions
    - revive         # idiomatic Go style (golint successor)
    - gocritic       # opinionated but catches real issues
    - forbidigo      # the engines reach files only through core/fsys

  disable:
    # funlen / cyclop / maintidx measure complexity but routinely flag
    # legitimate switch statements in this codebase (parser, organiseFile).
    - funlen
    - cyclop
    - maintidx
    - gocognit

  settings:
    revive:
      rules:
        # exported rule omitted - JSDoc block comments document all exported
        # symbols; Go's "must start with symbol name" godoc format is not enforced.
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: var-naming
        - name: blank-imports

    gocritic:
      # Only checks that are NOT already on by default - listing default checks
      # here makes golangci-lint emit "no need to enable" warnings.
      enabled-checks:
        - commentedOutCode
        - emptyFallthrough
        - nilValReturn
        - stringXbytes
        - unlabelStmt
        - unnecessaryBlock

    misspell:
      locale: US

    # Under core/ every file access goes through core/fsys, which a sandbox can
    # replace (Capsicum on FreeBSD resolves every path through os.Root); a
    # direct os.Open there would reach past it. The exclusions below exempt
    # core/fsys itself, tests, and everything outside core/.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.(Open|OpenFile|Create|Stat|Lstat|ReadDir|ReadFile|WriteFile|Mkdir|MkdirAll|MkdirTemp|CreateTemp|Remove|RemoveAll|Rename|Link|Symlink|Readlink|Chmod|Chown|Lchown|Chtimes|Truncate|Getwd|Chdir)$'
          msg: "reach files through core/fsys (fsys.Open, ...), which a sandbox can replace"
        - pattern: '^filepath\.(Abs|EvalSymlinks|Glob|Walk|WalkDir)$'
          msg: "use the core/fsys version, which a sandbox can replace"

  # v2 schema: file/rule exclusions live under linters.exclusions
  # (the old top-level `issues.exclude-dirs` / `issues.exclude-rules` keys were
  # removed in golangci-lint v2 and fail `golangci-lint config verify` in CI).
  exclusions:
    paths:
      - vendor
      - bin

    rules:
      # Test files: allow gocritic/revive latitude (helpers, longer funcs).
      - path: "_test\\.go"
        linters:
          - gocritic
          - revive

      # forbidigo guards core/ only: elsewhere (the commands, the tools, the
      # sandbox itself) the process's own file system is the right one.
      - path-except: "^core/"
        linters:
          - forbidigo
      - path: "^core/fsys/"
        linters:
          - forbidigo
      - path: "_test\\.go"
        linters:
          - forbidigo

      # Intentional best-effort closes (defer _ = f.Close()) are fine.
      - linters:
          - errcheck
        text: "Error return value of `.*\\.Close`"

      # os.Remove in cleanup paths is intentionally ignored via _ = os.Remove(...).
      - linters:
          - errcheck
        text: "Error return value of `(os|fsys)\\.Remove`"

      # Diagnostics and prompts are best-effort writes to the user's terminal;
      # a failed write to stderr/stdout is not actionable.
      - linters:
          - errcheck
        text: "Error return value of `fmt\\.Fprint(f|ln)?`"

# Formatting, checked by `golangci-lint run` and applied by `golangci-lint fmt`
# (`make fix` and the pre-commit hook in lefthook.yml). goimports groups this
# module's own imports last, after the standard library and third parties.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/braswelljr/gnux
  exclusions:
    paths:
      - vendor
      - bin

run:
  timeout: 5m
