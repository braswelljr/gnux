# Requirement enforced: a pushed version tag (v*) becomes a GitHub release with
# a statically linked (CGO_ENABLED=0) gnux archive for every supported platform
# - linux on amd64/arm64/riscv64, darwin and freebsd on amd64/arm64, windows on
# amd64/arm64 - each reporting the tag as its version, plus a checksums file
# and a build provenance attestation (FR-36, FR-38, NFR-1, NFR-2). Its notes
# are the tag's section of CHANGELOG.md, which a release must have; only a
# prerelease without one falls back to notes generated from the commits. The
# archives, checksums and package manifests (Homebrew, Scoop, winget) are
# described in .goreleaser.yaml.
name: Release

on:
  push:
    # Full versions only (v1.2.3, v1.2.3-rc.1): the major tags the setup-gnux
    # action is used by (v0, v1) are moved by this workflow, not released.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Read-only by default (NFR-37); only the publishing job may write releases.
permissions:
  contents: read

jobs:
  # The same gates as a pull request, against the tagged commit: a tag must not
  # publish what CI would reject.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Verify docs are up to date
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain documentation web/content/docs)" ]; then
            echo "::error::Generated docs are out of date at this tag. Run 'make docs' and commit." >&2
            exit 1
          fi

      # Checked here, before anything is built: a release without its
      # changelog section stops now. tools/changelog explains what is missing.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if go run ./tools/changelog "$TAG" > release-notes.md; then
            exit 0
          fi
          case "$TAG" in
            *-*)
              echo "::notice::No CHANGELOG.md section for prerelease $TAG; its notes are generated from the commits."
              : > release-notes.md
              ;;
            *)
              echo "::error::CHANGELOG.md has no section for $TAG. Add one and tag again."
              exit 1
              ;;
          esac

      - name: Keep the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # GoReleaser reads the previous tag for the fallback changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      # Each package manager publishes to a repository of its own with a token
      # stored as a secret; one whose secret is missing is skipped rather than
      # failing the release.
      - name: Choose what to publish
        id: plan
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          skip=""
          [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ] && skip="${skip},homebrew"
          [ -z "$SCOOP_BUCKET_GITHUB_TOKEN" ] && skip="${skip},scoop"
          [ -z "$WINGET_GITHUB_TOKEN" ] && skip="${skip},winget"
          args="--clean"
          [ -n "$skip" ] && args="$args --skip=${skip#,}"
          [ -s notes/release-notes.md ] && args="$args --release-notes=notes/release-notes.md"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release ${{ steps.plan.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt

      # `uses: braswelljr/gnux@v0` follows the newest stable release of that
      # major version; a prerelease leaves it where it is.
      - name: Move the major version tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
