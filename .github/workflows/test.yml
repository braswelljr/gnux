# Requirement enforced: the code vets and passes its tests under the race
# detector on Linux, macOS and Windows with the Go version pinned in go.mod,
# the built binary dispatches on its own name, every tool still compiles for
# js/wasm (the web playground), and the shell's parser and expansion survive
# a short fuzzing run.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # Use bash on every OS (git-bash on Windows) so the go commands parse
    # identically and coverage arguments aren't reinterpreted by PowerShell.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # gnux picks the tool from the name it is started under; prove that with a
      # real binary on every OS (a copy rather than a symlink, for Windows).
      - name: Smoke test (multi-call dispatch)
        run: |
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -o "bin/gnux${ext}" .
          cp "bin/gnux${ext}" "bin/pwdx${ext}"
          "./bin/gnux${ext}" --list
          "./bin/gnux${ext}" pwdx
          "./bin/pwdx${ext}"

      # The playground runs gnux in the browser, so every tool must keep
      # compiling for js/wasm.
      - name: Build for WebAssembly
        if: matrix.os == 'ubuntu-latest'
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /dev/null ./tools/wasm

      # The shell reads untrusted script text; a short run of each fuzz target
      # catches a panic before it ships. Seeds also run in the test step.
      - name: Fuzz the shell
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=30s ./core/shell
          go test -run='^$' -fuzz='^FuzzExpand$' -fuzztime=30s ./core/shell

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
