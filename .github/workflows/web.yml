# Requirement enforced: the website builds from a clean checkout - gnux
# compiles to WebAssembly, the playground's in-memory filesystem passes its
# tests against that real binary, and the Fumadocs site lints, type-checks and
# builds, and the built pages carry their SEO metadata. Needs Go (version from
# go.mod), Node.js 26 and pnpm (version from web/package.json).
name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "**.go"
      - go.mod
      - .github/workflows/web.yml
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "**.go"
      - go.mod
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      # No `cache: pnpm` here: setup-node asks pnpm for its store from the
      # repository root, and pnpm 11 under pnpm/action-setup answers with a
      # folder inside its own install that does not exist yet, which fails the
      # step. The store is pinned to one folder instead and cached below.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # The playground loads this binary; it is built, not committed.
      - name: Build gnux for WebAssembly
        run: make web/wasm

      # The docs pages are generated, not committed; the type-check and the
      # tests read them. The releases' docs come with the build, below.
      - name: Generate the docs content
        run: make web/docs

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Check formatting
        working-directory: web
        run: pnpm format:check

      - name: Type-check
        working-directory: web
        run: pnpm typecheck

      - name: Test the playground filesystem against the wasm
        working-directory: web
        run: pnpm test

      # The build also downloads the docs of each release for the version
      # picker; the token keeps the one API call from the shared rate limit.
      - name: Build
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      # Starts the built site and checks robots.txt, the sitemap, llms.txt and
      # each page's title, description, canonical URL and structured data.
      - name: Check SEO output
        working-directory: web
        run: pnpm test:seo
