# Requirement enforced: the committed generated documentation - the reference
# in documentation/ and the website content in web/content/docs/ - matches what the
# generator produces from the current code.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "documentation/guides/**"
      - "documentation/**"
      - "web/content/docs/**"
      - "tools/**"
      - go.mod
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "documentation/guides/**"
      - "documentation/**"
      - "web/content/docs/**"
      - "tools/**"
      - go.mod

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Writes the reference (documentation/, four formats) and the website content
      # (web/content/docs, MDX) from the tool registry.
      - name: Regenerate documentation
        run: go generate ./...

      - name: Verify docs are up to date
        run: |
          if [ -n "$(git status --porcelain documentation web/content/docs)" ]; then
            echo "::error::Generated docs are out of date. Run 'make docs' and commit the result." >&2
            git status --porcelain documentation web/content/docs
            git --no-pager diff -- documentation web/content/docs
            exit 1
          fi
