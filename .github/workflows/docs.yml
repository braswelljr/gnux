# Requirement enforced: the reference generates from the current code - in
# documentation/ (markdown, man, YAML, reST) and as the website content in
# web/content/docs/ - and the generator's own tests pass. The generated files
# are not committed: the website build and the release generate their own.
# The markdown reference is kept as a downloadable artifact of each run.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "documentation/guides/**"
      - CHANGELOG.md
      - "tools/**"
      - go.mod
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "documentation/guides/**"
      - CHANGELOG.md
      - "tools/**"
      - go.mod

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test the generator
        run: go test ./cmd/docs/... ./tools/gendocs/...

      # Writes the reference (documentation/, four formats) and the website content
      # (web/content/docs, MDX) from the tool registry.
      - name: Generate documentation
        run: go generate ./...

      - name: Keep the reference
        uses: actions/upload-artifact@v7
        with:
          name: reference
          path: |
            documentation/markdown
            documentation/man
          retention-days: 30
