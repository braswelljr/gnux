# Requirement enforced: the code is clean under golangci-lint v2 with the
# repository's .golangci.yml.
name: Lint

on:
  push:
    branches: ["main","staging"]
  pull_request:
    branches: ["main", "staging"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a known-good v2 release so a newer 'latest' can't tighten the
          # config schema and fail `config verify` out from under us.
          version: v2.12.2
          args: --timeout=5m
