# Requirement enforced: the code is clean under golangci-lint v2 with the
# repository's .golangci.yml.
name: Lint

on:
  push:
    branches: ["main","staging"]
  pull_request:
    branches: ["main", "staging"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin to a known-good v2 release so a newer 'latest' can't tighten the
          # config schema and fail `config verify` out from under us.
          version: v2.12.2
          args: --timeout=5m
