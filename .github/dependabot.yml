version: 2
updates:
  - package-ecosystem: gomod # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: weekly
    reviewers:
      - braswelljr
    assignees:
      - braswelljr
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Fetch and update latest `github-actions` pkgs
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    reviewers:
      - braswelljr
    assignees:
      - braswelljr
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # The website's packages (web/ is pnpm; Dependabot reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    reviewers:
      - braswelljr
    assignees:
      - braswelljr
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      web:
        patterns: ["*"]
    # typescript-eslint supports TypeScript 5 only so far; a TypeScript 7
    # bump breaks the Lint step of the Web workflow. Lift this once it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
