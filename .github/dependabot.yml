version: 2
updates:
  - package-ecosystem: gomod # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: weekly
    assignees:
      - braswelljr
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # pflag 1.1.0 lists a boolean flag as --help[=true|false], which changes
    # the generated reference away from GNU's option listing.
    ignore:
      - dependency-name: github.com/spf13/pflag
        versions: [">=1.1.0"]

  # Fetch and update latest `github-actions` pkgs
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    assignees:
      - braswelljr
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # The website's packages (web/ is pnpm; Dependabot reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    assignees:
      - braswelljr
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      web:
        patterns: ["*"]
    # typescript-eslint supports TypeScript up to 6.0 so far; a TypeScript 7
    # bump breaks the Lint step of the Web workflow. Lift this once it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The base images of the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - braswelljr
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
