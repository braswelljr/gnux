# Convenience wrapper for running gnux in a container.
#
# The current directory is mounted read-write at /work, so the tools operate on
# your files. Pass the tool and its arguments after the service name:
#
#   docker compose run --rm gnux --version
#   docker compose run --rm gnux lsx -la
#   docker compose run --rm gnux rmx -rv build/
#
# Caution: these are real file tools operating on the mounted volume.

services:
  gnux:
    build:
      context: .
      args:
        VERSION: dev
    image: braswelljr/gnux:dev
    volumes:
      - ./:/work
    # ENTRYPOINT is `gnux` (from the image); the tool and its arguments come
    # from the CLI.
