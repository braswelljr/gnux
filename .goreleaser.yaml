# GoReleaser configuration: what a release consists of. The Release workflow
# (.github/workflows/release.yml) runs it on a v* tag after the same checks a
# pull request passes, and `make release/snapshot` runs it locally without
# publishing anything.
#
# Every archive keeps the naming the first releases used,
# gnux-<tag>-<os>-<arch>.tar.gz (.zip on Windows), unpacking into a directory of
# the same name, so install instructions and the setup-gnux action keep working.
version: 2

project_name: gnux

before:
  hooks:
    # Shell completion scripts, generated from the command itself, ship in
    # every archive and are installed by the Homebrew cask.
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run . completion "$s" > "completions/gnux.$s"; done && go run . completion powershell > completions/gnux.ps1'

builds:
  # Unix-like targets. Split from Windows only so that each family's archive
  # can carry its own extra files (man pages here).
  - id: unix
    main: .
    binary: gnux
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/braswelljr/gnux/internal/common.Version={{ .Tag }}
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64, riscv64]
    ignore:
      - { goos: darwin, goarch: riscv64 }
      - { goos: freebsd, goarch: riscv64 }

  - id: windows
    main: .
    binary: gnux
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/braswelljr/gnux/internal/common.Version={{ .Tag }}
    goos: [windows]
    goarch: [amd64, arm64]

archives:
  - id: unix
    ids: [unix]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - completions/gnux.bash
      - completions/gnux.zsh
      - completions/gnux.fish
      # The man pages ship with the Unix archives, where man can read them.
      - src: documentation/man/**/*
        dst: man
        strip_parent: false

  - id: windows
    ids: [windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - completions/gnux.ps1

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The notes come from CHANGELOG.md (passed with --release-notes); this is the
# fallback for a prerelease that has no section there.
changelog:
  use: github
  sort: asc

release:
  github:
    owner: braswelljr
    name: gnux
  name_template: "gnux {{ .Tag }}"
  # A tag with a hyphen (v1.0.0-rc.1) is published as a prerelease.
  prerelease: auto
  # A release already drafted on GitHub for the tag (creating one in the web
  # interface is what pushed the tag) is completed instead of failing.
  mode: replace
  replace_existing_artifacts: true

# Linux packages, attached to the release beside the archives and listed in
# checksums.txt: .deb (Debian, Ubuntu), .rpm (Fedora, RHEL, openSUSE) and .apk
# (Alpine). They need no account or secret. Each installs /usr/bin/gnux and the
# completions; the tool names are linked by the user, as with every other
# install (`gnux --list`).
nfpms:
  - id: packages
    ids: [unix]
    package_name: gnux
    file_name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    vendor: braswelljr
    homepage: https://github.com/braswelljr/gnux
    maintainer: braswelljr <braswelljr@users.noreply.github.com>
    description: |-
      GNU core utilities in one portable, multi-call binary.
      gnux carries rmx, cpx, lsx and the rest, with GNU's flags, messages and
      exit statuses, plus a small portable shell.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gnux/LICENSE
      - src: completions/gnux.bash
        dst: /usr/share/bash-completion/completions/gnux
      - src: completions/gnux.fish
        dst: /usr/share/fish/vendor_completions.d/gnux.fish
      # Debian's zsh reads vendor-completions; every other distribution reads
      # site-functions.
      - src: completions/gnux.zsh
        dst: /usr/share/zsh/vendor-completions/_gnux
        packager: deb
      - src: completions/gnux.zsh
        dst: /usr/share/zsh/site-functions/_gnux
        packager: rpm
      - src: completions/gnux.zsh
        dst: /usr/share/zsh/site-functions/_gnux
        packager: apk

# Package managers. Each publishes to a repository or store of its own and
# needs a credential for it; the Release workflow skips any whose secret is
# not configured, so a fork can release without them.
#
# The snap is strictly confined: it reaches the user's home directory and
# removable media and nothing else, which the store accepts without a review.
# A prerelease goes to the snap's edge channel and to no other package manager
# (skip_upload: auto).
snapcrafts:
  - id: gnux
    ids: [unix]
    name: gnux
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    title: gnux
    summary: GNU core utilities in one portable, multi-call binary
    description: |
      gnux is a portable, GNU-compatible implementation of the GNU core
      utilities: one binary carrying rmx, cpx, lsx and the rest, with GNU's
      flags, messages and exit statuses, plus a small portable shell.

      Run a tool as `gnux rmx ...`, or a script with `gnux shell`. This snap is
      strictly confined: the tools see your home directory and, once
      `snap connect gnux:removable-media` is run, removable media.
    license: MIT
    base: core24
    grade: stable
    confinement: strict
    publish: true
    channel_templates:
      - "{{ if .Prerelease }}edge{{ else }}stable{{ end }}"
    apps:
      gnux:
        command: gnux
        plugs: [home, removable-media]

# gnux-bin on the Arch User Repository: the release archive, repackaged.
aurs:
  - name: gnux-bin
    ids: [unix]
    skip_upload: auto
    homepage: https://github.com/braswelljr/gnux
    description: GNU core utilities in one portable, multi-call binary
    maintainers:
      - braswelljr <braswelljr at users dot noreply dot github dot com>
    license: MIT
    private_key: '{{ envOrDefault "AUR_KEY" "" }}'
    git_url: ssh://aur@aur.archlinux.org/gnux-bin.git
    provides: [gnux]
    conflicts: [gnux]
    commit_author:
      name: braswelljr
      email: braswelljr@users.noreply.github.com
    # The archive unpacks into gnux-<tag>-linux-<arch>/.
    package: |-
      cd gnux-*/
      install -Dm755 gnux "${pkgdir}/usr/bin/gnux"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/gnux-bin/LICENSE"
      install -Dm644 completions/gnux.bash "${pkgdir}/usr/share/bash-completion/completions/gnux"
      install -Dm644 completions/gnux.zsh "${pkgdir}/usr/share/zsh/site-functions/_gnux"
      install -Dm644 completions/gnux.fish "${pkgdir}/usr/share/fish/vendor_completions.d/gnux.fish"

homebrew_casks:
  - name: gnux
    ids: [unix]
    skip_upload: auto
    repository:
      owner: braswelljr
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    commit_author:
      name: braswelljr
      email: braswelljr@users.noreply.github.com
    homepage: https://github.com/braswelljr/gnux
    description: GNU core utilities in one portable, multi-call binary
    license: MIT
    binaries: [gnux]
    completions:
      bash: completions/gnux.bash
      zsh: completions/gnux.zsh
      fish: completions/gnux.fish
    caveats: |
      Every tool also runs as a command of its own (rmx, cpx, lsx, ...) when
      linked to gnux under that name:
        for t in $(gnux --list); do ln -sf "$(brew --prefix)/bin/gnux" "$(brew --prefix)/bin/$t"; done
    hooks:
      post:
        # The binary is not notarized; clear the quarantine flag Gatekeeper
        # would otherwise refuse it with.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gnux"]
          end

scoops:
  - name: gnux
    ids: [windows]
    skip_upload: auto
    repository:
      owner: braswelljr
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}'
    commit_author:
      name: braswelljr
      email: braswelljr@users.noreply.github.com
    homepage: https://github.com/braswelljr/gnux
    description: GNU core utilities in one portable, multi-call binary
    license: MIT

winget:
  - name: gnux
    package_identifier: braswelljr.gnux
    publisher: braswelljr
    publisher_url: https://github.com/braswelljr
    ids: [windows]
    skip_upload: auto
    short_description: GNU core utilities in one portable, multi-call binary
    description: |
      gnux is a portable, GNU-compatible implementation of the GNU core
      utilities: one binary carrying rmx, cpx, lsx and the rest, with GNU's
      flags, messages and exit statuses, plus a small portable shell.
    homepage: https://github.com/braswelljr/gnux
    license: MIT
    license_url: https://github.com/braswelljr/gnux/blob/main/LICENSE
    release_notes_url: https://github.com/braswelljr/gnux/releases/tag/{{ .Tag }}
    tags: [coreutils, gnu, cli, shell, portable]
    repository:
      owner: braswelljr
      name: winget-pkgs
      branch: "gnux-{{ .Version }}"
      token: '{{ envOrDefault "WINGET_GITHUB_TOKEN" "" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
