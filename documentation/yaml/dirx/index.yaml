name: dirx
synopsis: |
    List directory contents in columns, whether or not the output is a terminal.
description: |-
    dirx is lsx -C -b: it lists each FILE, or the current directory, exactly as lsx does and takes every lsx option, but arranges the names in columns even when the output is piped or redirected (80 columns wide then, or -w COLS), and writes unprintable characters in names as backslash escapes (\n, \t, \ooo) so that every name fits on one line. An option that picks a format (-l, -1, -x, -m) or a quoting style (-Q) replaces those defaults. Diagnostics and exit statuses are lsx's, prefixed with dirx.

    EXIT STATUS.
      0  success
      1  minor trouble: an entry found while listing could not be examined
      2  serious trouble: a command-line operand could not be accessed, a directory could not be read, or a command-line mistake

    HELP. dirx --help shows the options and the first examples; gnux help dirx prints the full manual, and gnux help dirx OPTION explains one option.

    SEE ALSO. lsx, vdirx.

    PERMISSIONS. Listing a directory needs read permission on it; examining its entries (-l, -s, -i, -F, --color, sorting by time or size) also needs search permission. Nothing is ever modified.

    USE CASES.
      - Getting a compact column listing in a log or a file, where lsx prints one name per line.
      - Listing a directory the way Windows users expect a dir command to work.
      - Seeing names with newlines or tabs in them as escapes rather than broken lines.
      - Keeping a script's listing the same whether or not it runs in a terminal.
      - Comparing directory contents side by side in a narrow terminal with -w.
usage: dirx [OPTION]... [FILE]...
options:
    - name: across
      shorthand: x
      default_value: "false"
      usage: list entries by lines instead of by columns
    - name: all
      shorthand: a
      default_value: "false"
      usage: do not ignore entries starting with .
    - name: almost-all
      shorthand: A
      default_value: "false"
      usage: do not list implied . and ..
    - name: atime
      shorthand: u
      default_value: "false"
      usage: |
        with -lt: sort by, and show, access time; with -l: show access time and sort by name; otherwise: sort by access time, newest first
    - name: classify
      shorthand: F
      default_value: "false"
      usage: append indicator (one of */=@|) to entries
    - name: color
      default_value: never
      usage: |
        color the output `WHEN`: 'always' (the default when WHEN is omitted), 'auto', or 'never'
    - name: columns
      shorthand: C
      default_value: "false"
      usage: list entries by columns
    - name: commas
      shorthand: m
      default_value: "false"
      usage: fill width with a comma separated list of entries
    - name: ctime
      shorthand: c
      default_value: "false"
      usage: |
        with -lt: sort by, and show, ctime (time of last change of file status information); with -l: show ctime and sort by name; otherwise: sort by ctime, newest first
    - name: dereference
      shorthand: L
      default_value: "false"
      usage: |
        when showing file information for a symbolic link, show information for the file the link references rather than for the link itself
    - name: dereference-command-line
      shorthand: H
      default_value: "false"
      usage: follow symbolic links listed on the command line
    - name: directory
      shorthand: d
      default_value: "false"
      usage: list directories themselves, not their contents
    - name: escape
      shorthand: b
      default_value: "false"
      usage: print C-style escapes for nongraphic characters
    - name: file-type
      default_value: "false"
      usage: likewise, except do not append '*'
    - name: full-time
      default_value: "false"
      usage: like -l --time-style=full-iso
    - name: group-directories-first
      default_value: "false"
      usage: |
        group directories before files; any use of --sort=none (-U) disables grouping
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: hide
      usage: |
        do not list implied entries matching shell `PATTERN` (overridden by -a or -A)
    - name: hide-control-chars
      shorthand: q
      default_value: "false"
      usage: print ? instead of nongraphic characters
    - name: human-readable
      shorthand: h
      default_value: "false"
      usage: with -l and -s, print sizes like 1K 234M 2G etc.
    - name: ignore
      shorthand: I
      usage: do not list implied entries matching shell `PATTERN`
    - name: ignore-backups
      shorthand: B
      default_value: "false"
      usage: do not list implied entries ending with ~
    - name: inode
      shorthand: i
      default_value: "false"
      usage: print the index number of each file
    - name: long
      shorthand: l
      default_value: "false"
      usage: use a long listing format
    - name: long-no-group
      shorthand: o
      default_value: "false"
      usage: like -l, but do not list group information
    - name: long-no-owner
      shorthand: g
      default_value: "false"
      usage: like -l, but do not list owner
    - name: no-group
      shorthand: G
      default_value: "false"
      usage: in a long listing, don't print group names
    - name: numeric-uid-gid
      shorthand: "n"
      default_value: "false"
      usage: like -l, but list numeric user and group IDs
    - name: one-per-line
      shorthand: "1"
      default_value: "false"
      usage: list one file per line
    - name: quote-name
      shorthand: Q
      default_value: "false"
      usage: enclose entry names in double quotes
    - name: recursive
      shorthand: R
      default_value: "false"
      usage: list subdirectories recursively
    - name: reverse
      shorthand: r
      default_value: "false"
      usage: reverse order while sorting
    - name: si
      default_value: "false"
      usage: likewise, but use powers of 1000 not 1024
    - name: size
      shorthand: s
      default_value: "false"
      usage: print the allocated size of each file, in blocks
    - name: slash
      shorthand: p
      default_value: "false"
      usage: append / indicator to directories
    - name: sort
      usage: |
        sort by `WORD` instead of name: none (-U), size (-S), time (-t), version (-v), extension (-X), name, width
    - name: sort-extension
      shorthand: X
      default_value: "false"
      usage: sort alphabetically by entry extension
    - name: sort-size
      shorthand: S
      default_value: "false"
      usage: sort by file size, largest first
    - name: sort-time
      shorthand: t
      default_value: "false"
      usage: sort by time, newest first; see --time
    - name: sort-version
      shorthand: v
      default_value: "false"
      usage: natural sort of (version) numbers within text
    - name: tabsize
      shorthand: T
      usage: assume tab stops at each `COLS` instead of 8
    - name: time
      usage: |
        select which timestamp is shown or sorted on, `WORD`: access time (-u): atime, access, use; metadata change time (-c): ctime, status; modified time (default): mtime, modification; birth time: birth, creation
    - name: time-style
      usage: |
        time/date format with -l, `TIME_STYLE`: full-iso, long-iso, iso, locale, or +FORMAT
    - name: unsorted
      shorthand: U
      default_value: "false"
      usage: do not sort; list entries in directory order
    - name: version
      default_value: "false"
      usage: output version information and exit
    - name: width
      shorthand: w
      usage: set output width to `COLS`; 0 means no limit
example: |4-
      # List the current directory in columns
      dirx

      # Keep the columns when writing to a file
      dirx > listing.txt

      # Include hidden entries
      dirx -a

      # List entries across rather than down
      dirx -x src

      # Fit the columns in 40 characters
      dirx -w 40 /etc

      # Mark directories and executables
      dirx -F

      # Sort by modification time, newest first
      dirx -t

      # Show sizes in blocks next to each name
      dirx -sh

      # Switch to the long format, as vdirx does
      dirx -l

      # List a directory in the portable gnux shell
      gnux shell -c 'dirx -A dist'
