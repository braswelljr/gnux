name: gnux
synopsis: |
    The GNU core utilities' interface on every platform, in one Go binary.
description: |-
    gnux brings the interface of the GNU core utilities to every platform. Each tool is named after its GNU counterpart with an x appended (rm is rmx, cp is cpx) and mirrors its flags, semantics and diagnostics.

    Run a tool as a subcommand (gnux rmx -rf build), or link the binary to the tool's name and invoke it directly (rmx -rf build): gnux looks at the name it was started under and behaves as that tool. --list prints every tool name, one per line.

    gnux shell is a small portable shell whose commands are these tools: it runs the same script on every platform, with no dependency on the system's own shell.

    Every tool answers --help with its options, first examples and exit status. gnux help TOOL prints the tool's full manual - every option, permissions, use cases, every example for bash and PowerShell, exit status and related tools - and gnux help TOOL OPTION explains one option with the examples that use it.
usage: gnux [OPTION]... [TOOL [ARGUMENT]...]
options:
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: list
      default_value: "false"
      usage: print the name of every tool, one per line
    - name: version
      default_value: "false"
      usage: output version information and exit
example: |4-
      # run a tool through gnux
      gnux rmx -rf build/

      # make every tool a command of its own
      for t in $(gnux --list); do ln -s "$(command -v gnux)" "$HOME/bin/$t"; done
      rmx -rf build/

      # read a tool's full manual, or one option in depth
      gnux help rmx
      gnux help rmx --force
see_also:
    - gnux basenamex - Strip the directory and suffix from file names.
    - gnux catx - Concatenate files and print them on standard output.
    - gnux cpx - Copy files and directories.
    - gnux cutx - Remove sections from each line of files.
    - gnux dirnamex - Strip the last component from file names.
    - gnux echox - Display a line of text.
    - gnux envx - Run a program in a modified environment, or print the environment.
    - gnux falsex - Do nothing, unsuccessfully.
    - gnux headx - Print the first part of each file.
    - gnux lnx - Make hard or symbolic links between files.
    - gnux lsx - List information about files and directory contents.
    - gnux mkdirx - Create the DIRECTORY(ies), if they do not already exist.
    - gnux mvx - Move (rename) files and directories.
    - gnux printfx - Format and print data.
    - gnux pwdx - Print the full name of the current working directory.
    - gnux realpathx - Print the resolved absolute file name.
    - gnux rmdirx - Remove the DIRECTORY(ies), if they are empty.
    - gnux rmx - Remove (unlink) files and directories.
    - gnux seqx - Print a sequence of numbers.
    - gnux shell - Run a portable shell whose commands are the gnux tools.
    - gnux sleepx - Delay for a specified amount of time.
    - gnux sortx - Sort lines of text files.
    - gnux tailx - Print the last part of each file, optionally following it as it grows.
    - gnux teex - Copy standard input to each FILE, and also to standard output.
    - gnux touchx - Update the access and modification times of each FILE to the current time.
    - gnux truex - Do nothing, successfully.
    - gnux trx - Translate, squeeze, and/or delete characters from standard input.
    - gnux uniqx - Report or omit repeated lines.
    - gnux wcx - Print newline, word, and byte counts for each file.
    - gnux yesx - Output a string repeatedly until killed.
