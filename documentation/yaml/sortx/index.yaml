name: sortx
synopsis: Sort lines of text files.
description: |-
    sortx writes the sorted concatenation of all FILEs to standard output. With no FILE, or when FILE is -, it reads standard input. By default whole lines are compared byte by byte. -n, -g, -h, -M and -V compare as numbers, floating-point numbers, sizes with SI suffixes (2K, 1G), month names and version numbers; -b, -d, -f and -i ignore leading blanks, keep only blanks and alphanumerics, fold case and keep only printable characters; -r reverses the result. -k POS1[,POS2] sorts on a key, where each POS is F[.C][OPTS]: field F, character C, and any of the ordering letters bdfghiMnrV, which then apply to that key alone. A key with no letters inherits the global options. Fields are separated by -t SEP, or else by the change from a non-blank to a blank character, so a field keeps its leading blanks. When all keys compare equal, the whole lines are compared as a last resort, unless -s (stable) or -u (unique, which keeps the first of each run of equal lines) is given. -c and -C check whether the input is already sorted, -m merges inputs that already are, -o FILE writes the result to FILE (which may be one of the inputs), and -z makes NUL the line delimiter. Ordering options that contradict each other, such as -n with -g, are refused. Differences from GNU sort: comparison always follows the C locale (byte order, ASCII case folding and month names, '.' as the decimal point, no thousands separator) whatever LANG and LC_ALL say; -R, --random-sort, --random-source and --debug are not implemented; -S, -T, --parallel, --batch-size and --compress-program are accepted and ignored, because sortx sorts in memory; when -c and -C are both given, the diagnosing -c wins whatever their order, so disorder is never hidden.

    EXIT STATUS.
      0  success; with -c or -C, the input is sorted
      1  with -c or -C, the input is not sorted
      2  trouble: an input could not be read, the output could not be written, or a command-line mistake

    HELP. sortx --help shows the options and the first examples; gnux help sortx prints the full manual, and gnux help sortx OPTION explains one option.

    SEE ALSO. headx, tailx, wcx, catx.

    PERMISSIONS. Needs read permission on each FILE and search permission on the directories leading to it. With -o, needs write permission on the output file, or on its directory when it does not exist yet. Every input is checked to be readable before the output file is opened, and the output is only emptied once all input has been read, so sorting a file onto itself is safe.

    USE CASES.
      - Putting a list of names, words or paths into a predictable order.
      - Ordering numbers or sizes correctly with -n or -h instead of alphabetically.
      - Sorting a CSV-like or colon-separated file on one column with -t and -k.
      - Removing duplicate lines in one step with -u.
      - Sorting release tags or file names that contain version numbers with -V.
      - Finding the largest entries of a listing with -rn and headx.
      - Merging several already sorted files cheaply with -m.
      - Verifying in a script that a file is sorted with -c or -C.
      - Sorting a file in place with -o.
      - Handling NUL-separated file lists safely with -z.
usage: sortx [OPTION]... [FILE]...
options:
    - name: batch-size
      default_value: "0"
      usage: |
        accepted for compatibility and ignored (merge at most `NMERGE` inputs at once)
    - name: buffer-size
      shorthand: S
      usage: |
        accepted for compatibility and ignored (`SIZE` of the main memory buffer)
    - name: check
      shorthand: c
      usage: |
        check for sorted input; do not sort. `WHEN` (diagnose-first, quiet, silent) says whether to report the first disorder
    - name: check-quiet
      shorthand: C
      default_value: "false"
      usage: like -c, but do not report first bad line
    - name: compress-program
      usage: |
        accepted for compatibility and ignored (`PROG` to compress temporaries)
    - name: dictionary-order
      shorthand: d
      default_value: "false"
      usage: consider only blanks and alphanumeric characters
    - name: field-separator
      shorthand: t
      usage: use `SEP` instead of non-blank to blank transition
    - name: files0-from
      usage: |
        read input from the files specified by NUL-terminated names in file `F`; if F is - then read names from standard input
    - name: general-numeric-sort
      shorthand: g
      default_value: "false"
      usage: compare according to general numerical value
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: human-numeric-sort
      shorthand: h
      default_value: "false"
      usage: compare human readable numbers (e.g., 2K 1G)
    - name: ignore-case
      shorthand: f
      default_value: "false"
      usage: fold lower case to upper case characters
    - name: ignore-leading-blanks
      shorthand: b
      default_value: "false"
      usage: ignore leading blanks
    - name: ignore-nonprinting
      shorthand: i
      default_value: "false"
      usage: consider only printable characters
    - name: key
      shorthand: k
      default_value: '[]'
      usage: sort via a key; `KEYDEF` gives location and type
    - name: merge
      shorthand: m
      default_value: "false"
      usage: merge already sorted files; do not sort
    - name: month-sort
      shorthand: M
      default_value: "false"
      usage: compare (unknown) < 'JAN' < ... < 'DEC'
    - name: numeric-sort
      shorthand: "n"
      default_value: "false"
      usage: compare according to string numerical value
    - name: output
      shorthand: o
      usage: write result to `FILE` instead of standard output
    - name: parallel
      default_value: "0"
      usage: |
        accepted for compatibility and ignored (`N` concurrent sorts)
    - name: reverse
      shorthand: r
      default_value: "false"
      usage: reverse the result of comparisons
    - name: sort
      usage: |
        sort according to `WORD`: general-numeric -g, human-numeric -h, month -M, numeric -n, version -V
    - name: stable
      shorthand: s
      default_value: "false"
      usage: stabilize sort by disabling last-resort comparison
    - name: temporary-directory
      shorthand: T
      default_value: '[]'
      usage: |
        accepted for compatibility and ignored (`DIR` for temporaries)
    - name: unique
      shorthand: u
      default_value: "false"
      usage: output only the first of an equal run
    - name: version
      default_value: "false"
      usage: output version information and exit
    - name: version-sort
      shorthand: V
      default_value: "false"
      usage: natural sort of (version) numbers within text
    - name: zero-terminated
      shorthand: z
      default_value: "false"
      usage: line delimiter is NUL, not newline
example: |4-
      # Sort the lines of a file
      sortx names.txt

      # Sort in reverse order
      sortx -r names.txt

      # Sort numbers by value rather than as text
      sortx -n numbers.txt

      # Sort and drop duplicate lines
      sortx -u words.txt

      # Sort case-insensitively
      sortx -f names.txt

      # Sort a colon-separated file numerically on its third field
      sortx -t : -k 3,3n /etc/passwd

      # Sort on the second column, then by the first in reverse
      sortx -k 2,2 -k 1,1r scores.txt

      # Sort human-readable sizes
      printf '2K\n1G\n10M\n' | sortx -h

      # Sort version numbers naturally
      printf 'v1.10\nv1.2\nv1.9\n' | sortx -V

      # Print the three largest numbers of a file
      sortx -rn numbers.txt | headx -n 3

      # Sort a file in place
      sortx -o names.txt names.txt

      # Merge files that are already sorted
      sortx -m jan.txt feb.txt mar.txt

      # Fail a script when a file is not sorted (exit status 1)
      sortx -C names.txt || echox 'names.txt is not sorted'

      # Report the first line out of order
      sortx -c names.txt

      # Sort a NUL-separated list of file names
      find . -print0 | sortx -z

      # Sort a directory listing in the portable gnux shell
      gnux shell -c 'lsx -1 | sortx -r'
