name: vdirx
synopsis: List directory contents in the long format.
description: |-
    vdirx is lsx -l -b: it lists each FILE, or the current directory, exactly as lsx does and takes every lsx option, but in the long format (mode, link count, owner, group, size, timestamp and name) by default, and writes unprintable characters in names as backslash escapes (\n, \t, \ooo) so that every entry fits on one line, and never prints '?' for one unless -q is given. An option that picks a format (-1, -C, -x, -m, --format) or a quoting style (-N, -Q, --quoting-style, or the QUOTING_STYLE variable) replaces those defaults. Diagnostics and exit statuses are lsx's, prefixed with vdirx.

    EXIT STATUS.
      0  success
      1  minor trouble: an entry found while listing could not be examined
      2  serious trouble: a command-line operand could not be accessed, a directory could not be read, or a command-line mistake

    HELP. vdirx --help shows the options and the first examples; gnux help vdirx prints the full manual, and gnux help vdirx OPTION explains one option.

    SEE ALSO. lsx, dirx, statx.

    PERMISSIONS. Listing a directory needs read permission on it, and the long format needs search permission to examine each entry. Nothing is ever modified.

    USE CASES.
      - Seeing permissions, owners, sizes and times without remembering -l.
      - Checking what a build produced, with sizes in human units (-h).
      - Finding the most recently changed files with -t.
      - Recording a directory's state in a log, one entry per line even for odd names.
      - Giving Windows users a detailed directory listing under a familiar name.
usage: vdirx [OPTION]... [FILE]...
options:
    - name: across
      shorthand: x
      default_value: "false"
      usage: list entries by lines instead of by columns
    - name: all
      shorthand: a
      default_value: "false"
      usage: do not ignore entries starting with .
    - name: almost-all
      shorthand: A
      default_value: "false"
      usage: do not list implied . and ..
    - name: atime
      shorthand: u
      default_value: "false"
      usage: |
        with -lt: sort by, and show, access time; with -l: show access time and sort by name; otherwise: sort by access time, newest first
    - name: author
      default_value: "false"
      usage: with -l, print the author of each file
    - name: block-size
      usage: |
        with -l, scale sizes by `SIZE` when printing them; e.g., '--block-size=M'
    - name: classify
      shorthand: F
      default_value: "false"
      usage: append indicator (one of */=@|) to entries
    - name: color
      usage: |
        color the output `WHEN`: 'always' (the default when WHEN is omitted), 'auto', or 'never'
    - name: columns
      shorthand: C
      default_value: "false"
      usage: list entries by columns
    - name: commas
      shorthand: m
      default_value: "false"
      usage: fill width with a comma separated list of entries
    - name: ctime
      shorthand: c
      default_value: "false"
      usage: |
        with -lt: sort by, and show, ctime (time of last change of file status information); with -l: show ctime and sort by name; otherwise: sort by ctime, newest first
    - name: dereference
      shorthand: L
      default_value: "false"
      usage: |
        when showing file information for a symbolic link, show information for the file the link references rather than for the link itself
    - name: dereference-command-line
      shorthand: H
      default_value: "false"
      usage: follow symbolic links listed on the command line
    - name: directory
      shorthand: d
      default_value: "false"
      usage: list directories themselves, not their contents
    - name: dired
      shorthand: D
      default_value: "false"
      usage: generate output designed for Emacs' dired mode
    - name: escape
      shorthand: b
      default_value: "false"
      usage: print C-style escapes for nongraphic characters
    - name: file-type
      default_value: "false"
      usage: likewise, except do not append '*'
    - name: format
      usage: |
        across -x, commas -m, horizontal -x, long -l, single-column -1, verbose -l, vertical -C (`WORD`)
    - name: full-time
      default_value: "false"
      usage: like -l --time-style=full-iso
    - name: group-directories-first
      default_value: "false"
      usage: |
        group directories before files; any use of --sort=none (-U) disables grouping
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: hide
      usage: |
        do not list implied entries matching shell `PATTERN` (overridden by -a or -A)
    - name: hide-control-chars
      shorthand: q
      default_value: "false"
      usage: print ? instead of nongraphic characters
    - name: human-readable
      shorthand: h
      default_value: "false"
      usage: with -l and -s, print sizes like 1K 234M 2G etc.
    - name: hyperlink
      usage: |
        hyperlink file names `WHEN`: 'always' (the default when WHEN is omitted), 'auto', or 'never'
    - name: ignore
      shorthand: I
      usage: do not list implied entries matching shell `PATTERN`
    - name: ignore-backups
      shorthand: B
      default_value: "false"
      usage: do not list implied entries ending with ~
    - name: indicator-style
      usage: |
        append indicator with style `WORD` to entry names: none (default), slash (-p), file-type (--file-type), classify (-F)
    - name: inode
      shorthand: i
      default_value: "false"
      usage: print the index number of each file
    - name: kibibytes
      shorthand: k
      default_value: "false"
      usage: |
        default to 1024-byte blocks for file system usage; used only with -s and per directory totals
    - name: literal
      shorthand: "N"
      default_value: "false"
      usage: print entry names without quoting
    - name: long
      shorthand: l
      default_value: "false"
      usage: use a long listing format
    - name: long-no-group
      shorthand: o
      default_value: "false"
      usage: like -l, but do not list group information
    - name: long-no-owner
      shorthand: g
      default_value: "false"
      usage: like -l, but do not list owner
    - name: no-group
      shorthand: G
      default_value: "false"
      usage: in a long listing, don't print group names
    - name: numeric-uid-gid
      shorthand: "n"
      default_value: "false"
      usage: like -l, but list numeric user and group IDs
    - name: one-per-line
      shorthand: "1"
      default_value: "false"
      usage: list one file per line
    - name: quote-name
      shorthand: Q
      default_value: "false"
      usage: enclose entry names in double quotes
    - name: quoting-style
      usage: |
        use quoting style `WORD` for entry names: literal, locale, shell, shell-always, shell-escape, shell-escape-always, c, escape (overrides QUOTING_STYLE environment variable)
    - name: recursive
      shorthand: R
      default_value: "false"
      usage: list subdirectories recursively
    - name: reverse
      shorthand: r
      default_value: "false"
      usage: reverse order while sorting
    - name: show-control-chars
      default_value: "false"
      usage: |
        show nongraphic characters as-is (the default, unless program is 'ls' and output is a terminal)
    - name: si
      default_value: "false"
      usage: likewise, but use powers of 1000 not 1024
    - name: size
      shorthand: s
      default_value: "false"
      usage: print the allocated size of each file, in blocks
    - name: slash
      shorthand: p
      default_value: "false"
      usage: append / indicator to directories
    - name: sort
      usage: |
        sort by `WORD` instead of name: none (-U), size (-S), time (-t), version (-v), extension (-X), name, width
    - name: sort-extension
      shorthand: X
      default_value: "false"
      usage: sort alphabetically by entry extension
    - name: sort-size
      shorthand: S
      default_value: "false"
      usage: sort by file size, largest first
    - name: sort-time
      shorthand: t
      default_value: "false"
      usage: sort by time, newest first; see --time
    - name: sort-version
      shorthand: v
      default_value: "false"
      usage: natural sort of (version) numbers within text
    - name: tabsize
      shorthand: T
      usage: assume tab stops at each `COLS` instead of 8
    - name: time
      usage: |
        select which timestamp is shown or sorted on, `WORD`: access time (-u): atime, access, use; metadata change time (-c): ctime, status; modified time (default): mtime, modification; birth time: birth, creation
    - name: time-style
      usage: |
        time/date format with -l, `TIME_STYLE`: full-iso, long-iso, iso, locale, or +FORMAT
    - name: unsorted
      shorthand: U
      default_value: "false"
      usage: do not sort; list entries in directory order
    - name: version
      default_value: "false"
      usage: output version information and exit
    - name: width
      shorthand: w
      usage: set output width to `COLS`; 0 means no limit
    - name: zero
      default_value: "false"
      usage: end each output line with NUL, not newline
example: |4-
      # List the current directory in detail
      vdirx

      # Show sizes in human units
      vdirx -h dist

      # Include hidden entries
      vdirx -a

      # Newest files first
      vdirx -t

      # Largest files first
      vdirx -S

      # Show full timestamps
      vdirx --full-time

      # Show numeric user and group IDs
      vdirx -n

      # Describe a directory itself, not its contents
      vdirx -d src

      # Go back to names only
      vdirx -1

      # List a directory in the portable gnux shell
      gnux shell -c 'vdirx -h dist'
