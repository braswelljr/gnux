name: b2sumx
synopsis: Print or check BLAKE2b (512-bit) checksums.
description: |-
    b2sumx prints or checks BLAKE2b message digests (RFC 7693, 512 bits). For each FILE it prints one line: the digest in hexadecimal, a space, a mode mark (a space for text mode, '*' with -b), and the file name. With no FILE, or when FILE is -, it reads standard input. Files are always read as bytes, so -b and -t change only the mark; when both are given, -t wins. --tag prints BSD-style lines instead ('ALGORITHM (FILE) = DIGEST'). A file name containing a backslash, newline or carriage return is escaped and its line starts with a backslash, unless -z ends lines with NUL instead. -c reads such lines (in either style) from the FILEs and checks each listed file, printing 'FILE: OK' or 'FILE: FAILED' and a summary warning of mismatches, unreadable files and improperly formatted lines; --quiet drops the OK lines, --status prints nothing, --ignore-missing skips listed files that do not exist, -w warns about each improperly formatted line and --strict fails because of them. The exit status is 0 when everything was read (and, with -c, matched), 1 otherwise. -l BITS shortens the digest to BITS bits, a multiple of 8 up to 512; tagged lines then name the length ('BLAKE2b-256'). On Windows a backslash in a file name is the path separator, so it is not escaped as GNU escapes it on Unix; a name with a newline is still escaped.

    EXIT STATUS.
      0  success: every operand was processed
      1  failure: an operand could not be processed (diagnosed on standard error), or a command-line mistake

    HELP. b2sumx --help shows the options and the first examples; gnux help b2sumx prints the full manual, and gnux help b2sumx OPTION explains one option.

    SEE ALSO. cksumx, md5sumx, sha1sumx, sha256sumx, sha512sumx.

    PERMISSIONS. Needs read permission on each FILE (and, with -c, on the checksum lists and every file they name) and search permission on the directories leading to them. Nothing is ever modified.

    USE CASES.
      - Verifying a download against the checksum its publisher lists.
      - Recording digests of release artifacts so users can check them.
      - Detecting whether files changed between two points in time.
      - Finding duplicate files by comparing their digests.
      - Checking a backup or a copy against the original.
usage: b2sumx [OPTION]... [FILE]...
options:
    - name: binary
      shorthand: b
      default_value: "false"
      usage: read in binary mode
    - name: check
      shorthand: c
      default_value: "false"
      usage: read checksums from the FILEs and check them
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: ignore-missing
      default_value: "false"
      usage: don't fail or report status for missing files
    - name: length
      shorthand: l
      usage: |
        digest length in `bits`; must not exceed the maximum for the blake2 algorithm and must be a multiple of 8
    - name: quiet
      default_value: "false"
      usage: don't print OK for each successfully verified file
    - name: status
      default_value: "false"
      usage: don't output anything, status code shows success
    - name: strict
      default_value: "false"
      usage: exit non-zero for improperly formatted checksum lines
    - name: tag
      default_value: "false"
      usage: create a BSD-style checksum
    - name: text
      shorthand: t
      default_value: "false"
      usage: read in text mode (default)
    - name: version
      default_value: "false"
      usage: output version information and exit
    - name: warn
      shorthand: w
      default_value: "false"
      usage: warn about improperly formatted checksum lines
    - name: zero
      shorthand: z
      default_value: "false"
      usage: |
        end each output line with NUL, not newline, and disable file name escaping
example: |4-
      # You downloaded an installer: print its digest to compare with the one on the website
      b2sumx ubuntu-24.04-desktop-amd64.iso

      # Verify the download against the publisher's checksum file, which lists other files too
      b2sumx -c --ignore-missing b2.sums

      # Publish checksums next to your release archives
      b2sumx dist/*.tar.gz > dist/b2.sums

      # Check that a backup copied to a USB drive still matches the original
      b2sumx photos.tar /media/usb/photos.tar

      # Find duplicate photos in a folder: files with the same digest have the same content
      b2sumx *.jpg | sortx | uniqx -w 128 -D

      # In CI, fail the build when a vendored file was changed by hand
      b2sumx -c --status vendor.b2sums || { echox 'vendored files changed' >&2; exit 1; }

      # Re-check a large archive set and show only what no longer matches
      b2sumx -c --quiet b2.sums

      # Hash a token from a variable, without the newline echo would add
      printfx '%s' "$TOKEN" | b2sumx

      # Write lines that name the algorithm, so a mixed list can be checked with cksumx -c
      b2sumx --tag release.tar.gz >> CHECKSUMS

      # Refuse a checksum list with malformed lines instead of skipping them
      b2sumx -c --strict -w b2.sums

      # Match the '*' binary-mode lines produced by tools on Windows
      b2sumx -b setup.exe

      # Use a shorter, 256-bit digest as a compact content ID for cache keys
      b2sumx -l 256 package-lock.json

      # Record a digest next to the file in the portable gnux shell, the same on every OS
      gnux shell -c 'b2sumx file.iso > file.iso.b2sum'
