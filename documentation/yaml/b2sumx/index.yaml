name: b2sumx
synopsis: Print or check BLAKE2b (512-bit) checksums.
description: |-
    b2sumx prints or checks BLAKE2b message digests (RFC 7693, 512 bits). For each FILE it prints one line: the digest in hexadecimal, a space, a mode mark (a space for text mode, '*' with -b), and the file name. With no FILE, or when FILE is -, it reads standard input. Files are always read as bytes, so -b and -t change only the mark; when both are given, -t wins. --tag prints BSD-style lines instead ('ALGORITHM (FILE) = DIGEST'). A file name containing a backslash, newline or carriage return is escaped and its line starts with a backslash, unless -z ends lines with NUL instead. -c reads such lines (in either style) from the FILEs and checks each listed file, printing 'FILE: OK' or 'FILE: FAILED' and a summary warning of mismatches, unreadable files and improperly formatted lines; --quiet drops the OK lines, --status prints nothing, --ignore-missing skips listed files that do not exist, -w warns about each improperly formatted line and --strict fails because of them. The exit status is 0 when everything was read (and, with -c, matched), 1 otherwise. -l BITS shortens the digest to BITS bits, a multiple of 8 up to 512; tagged lines then name the length ('BLAKE2b-256').

    EXIT STATUS.
      0  success: every operand was processed
      1  failure: an operand could not be processed (diagnosed on standard error), or a command-line mistake

    HELP. b2sumx --help shows the options and the first examples; gnux help b2sumx prints the full manual, and gnux help b2sumx OPTION explains one option.

    SEE ALSO. cksumx, md5sumx, sha1sumx, sha256sumx, sha512sumx.

    PERMISSIONS. Needs read permission on each FILE (and, with -c, on the checksum lists and every file they name) and search permission on the directories leading to them. Nothing is ever modified.

    USE CASES.
      - Verifying a download against the checksum its publisher lists.
      - Recording digests of release artifacts so users can check them.
      - Detecting whether files changed between two points in time.
      - Finding duplicate files by comparing their digests.
      - Checking a backup or a copy against the original.
usage: b2sumx [OPTION]... [FILE]...
options:
    - name: binary
      shorthand: b
      default_value: "false"
      usage: read in binary mode
    - name: check
      shorthand: c
      default_value: "false"
      usage: read checksums from the FILEs and check them
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: ignore-missing
      default_value: "false"
      usage: don't fail or report status for missing files
    - name: length
      shorthand: l
      usage: |
        digest length in `bits`; must not exceed the maximum for the blake2 algorithm and must be a multiple of 8
    - name: quiet
      default_value: "false"
      usage: don't print OK for each successfully verified file
    - name: status
      default_value: "false"
      usage: don't output anything, status code shows success
    - name: strict
      default_value: "false"
      usage: exit non-zero for improperly formatted checksum lines
    - name: tag
      default_value: "false"
      usage: create a BSD-style checksum
    - name: text
      shorthand: t
      default_value: "false"
      usage: read in text mode (default)
    - name: version
      default_value: "false"
      usage: output version information and exit
    - name: warn
      shorthand: w
      default_value: "false"
      usage: warn about improperly formatted checksum lines
    - name: zero
      shorthand: z
      default_value: "false"
      usage: |
        end each output line with NUL, not newline, and disable file name escaping
example: |4-
      # Print the digest of a file
      b2sumx file.iso

      # Digest several files
      b2sumx *.tar.gz

      # Digest standard input
      echox -n hello | b2sumx

      # Save digests to a file
      b2sumx *.iso > b2.sums

      # Verify files against saved digests
      b2sumx -c b2.sums

      # Verify quietly, showing only failures
      b2sumx -c --quiet b2.sums

      # Verify silently and branch on the result
      b2sumx -c --status b2.sums && echox verified

      # Verify only the listed files that exist
      b2sumx -c --ignore-missing b2.sums

      # Fail on malformed lines in the list
      b2sumx -c --strict -w b2.sums

      # Print BSD-style tagged lines
      b2sumx --tag file.iso

      # Mark the files as read in binary mode
      b2sumx -b file.iso

      # Print a 256-bit digest
      b2sumx -l 256 file.iso

      # Digest in the portable gnux shell
      gnux shell -c 'b2sumx file.iso > file.iso.b2sum'
