name: lsx
synopsis: List information about files and directory contents.
description: |-
    lsx lists each FILE, or the current directory when none is given. Operands that are not directories are listed first, then the contents of each directory under a 'dir:' header. Entries whose names start with '.' are hidden unless -a or -A is given. On a terminal the names are arranged in columns sized to the window; when the output is piped or redirected there is one name per line. -l selects the long format (mode, link count, owner, group, size, timestamp and name), where timestamps from the last six months show the time of day and older ones show the year. Entries are sorted by name using plain byte comparison - the C locale's collation, so uppercase sorts before lowercase regardless of the environment's locale - or by time (-t), size (-S), extension (-X) or version (-v), optionally reversed with -r. When several flags of one family are given (-l/-1/-C/-x/-m, the sort keys, -a/-A, -c/-u/--time, …) the last one on the command line wins, as in GNU ls. The exit status is 0 on success, 1 for minor problems such as an entry that cannot be examined, and 2 for serious trouble such as an operand that cannot be accessed.

    EXIT STATUS.
      0  success
      1  minor trouble: an entry found while listing could not be examined
      2  serious trouble: a command-line operand could not be accessed, a directory could not be read, or a command-line mistake

    HELP. lsx --help shows the options and the first examples; gnux help lsx prints the full manual, and gnux help lsx OPTION explains one option.

    SEE ALSO. realpathx, wcx, touchx.

    PERMISSIONS. Listing a directory needs read permission on it; examining its entries (anything beyond bare names: -l, -s, -i, -F, --color, sorting by time or size) also needs search permission. Entries that cannot be examined are still listed, with '?' in place of the unknown fields. On Windows, which has no POSIX owner, group, inode or block count, those columns hold placeholders, and with no POSIX permission bits every directory is colored as a plain directory, never as other-writable or sticky.

    USE CASES.
      - Seeing what is in a directory at a glance.
      - Inspecting permissions, ownership, sizes and timestamps with -l.
      - Finding the newest or largest files with -lt or -lS.
      - Walking a tree with -R, or feeding one name per line to a script with -1.
      - Showing hidden files with -A, or telling file types apart with -F or --color.
      - Checking that a build or download produced the expected files before the next step runs.
      - Comparing versioned release directories in natural order with -v.
      - Auditing which files changed recently by sorting on modification, access or change time.
      - Producing stable, script-friendly listings (one per line, no colors) that behave the same on every platform.
      - Spotting oddly named files (spaces, control characters) with -Q, -b or -q.
usage: lsx [OPTION]... [FILE]...
options:
    - name: across
      shorthand: x
      default_value: "false"
      usage: list entries by lines instead of by columns
    - name: all
      shorthand: a
      default_value: "false"
      usage: do not ignore entries starting with .
    - name: almost-all
      shorthand: A
      default_value: "false"
      usage: do not list implied . and ..
    - name: atime
      shorthand: u
      default_value: "false"
      usage: |
        with -lt: sort by, and show, access time; with -l: show access time and sort by name; otherwise: sort by access time, newest first
    - name: classify
      shorthand: F
      default_value: "false"
      usage: append indicator (one of */=@|) to entries
    - name: color
      default_value: never
      usage: |
        color the output `WHEN`: 'always' (the default when WHEN is omitted), 'auto', or 'never'
    - name: columns
      shorthand: C
      default_value: "false"
      usage: list entries by columns
    - name: commas
      shorthand: m
      default_value: "false"
      usage: fill width with a comma separated list of entries
    - name: ctime
      shorthand: c
      default_value: "false"
      usage: |
        with -lt: sort by, and show, ctime (time of last change of file status information); with -l: show ctime and sort by name; otherwise: sort by ctime, newest first
    - name: dereference
      shorthand: L
      default_value: "false"
      usage: |
        when showing file information for a symbolic link, show information for the file the link references rather than for the link itself
    - name: dereference-command-line
      shorthand: H
      default_value: "false"
      usage: follow symbolic links listed on the command line
    - name: directory
      shorthand: d
      default_value: "false"
      usage: list directories themselves, not their contents
    - name: escape
      shorthand: b
      default_value: "false"
      usage: print C-style escapes for nongraphic characters
    - name: file-type
      default_value: "false"
      usage: likewise, except do not append '*'
    - name: full-time
      default_value: "false"
      usage: like -l --time-style=full-iso
    - name: group-directories-first
      default_value: "false"
      usage: |
        group directories before files; any use of --sort=none (-U) disables grouping
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: hide
      usage: |
        do not list implied entries matching shell `PATTERN` (overridden by -a or -A)
    - name: hide-control-chars
      shorthand: q
      default_value: "false"
      usage: print ? instead of nongraphic characters
    - name: human-readable
      shorthand: h
      default_value: "false"
      usage: with -l and -s, print sizes like 1K 234M 2G etc.
    - name: ignore
      shorthand: I
      usage: do not list implied entries matching shell `PATTERN`
    - name: ignore-backups
      shorthand: B
      default_value: "false"
      usage: do not list implied entries ending with ~
    - name: inode
      shorthand: i
      default_value: "false"
      usage: print the index number of each file
    - name: long
      shorthand: l
      default_value: "false"
      usage: use a long listing format
    - name: long-no-group
      shorthand: o
      default_value: "false"
      usage: like -l, but do not list group information
    - name: long-no-owner
      shorthand: g
      default_value: "false"
      usage: like -l, but do not list owner
    - name: no-group
      shorthand: G
      default_value: "false"
      usage: in a long listing, don't print group names
    - name: numeric-uid-gid
      shorthand: "n"
      default_value: "false"
      usage: like -l, but list numeric user and group IDs
    - name: one-per-line
      shorthand: "1"
      default_value: "false"
      usage: list one file per line
    - name: quote-name
      shorthand: Q
      default_value: "false"
      usage: enclose entry names in double quotes
    - name: recursive
      shorthand: R
      default_value: "false"
      usage: list subdirectories recursively
    - name: reverse
      shorthand: r
      default_value: "false"
      usage: reverse order while sorting
    - name: si
      default_value: "false"
      usage: likewise, but use powers of 1000 not 1024
    - name: size
      shorthand: s
      default_value: "false"
      usage: print the allocated size of each file, in blocks
    - name: slash
      shorthand: p
      default_value: "false"
      usage: append / indicator to directories
    - name: sort
      usage: |
        sort by `WORD` instead of name: none (-U), size (-S), time (-t), version (-v), extension (-X), name, width
    - name: sort-extension
      shorthand: X
      default_value: "false"
      usage: sort alphabetically by entry extension
    - name: sort-size
      shorthand: S
      default_value: "false"
      usage: sort by file size, largest first
    - name: sort-time
      shorthand: t
      default_value: "false"
      usage: sort by time, newest first; see --time
    - name: sort-version
      shorthand: v
      default_value: "false"
      usage: natural sort of (version) numbers within text
    - name: tabsize
      shorthand: T
      usage: assume tab stops at each `COLS` instead of 8
    - name: time
      usage: |
        select which timestamp is shown or sorted on, `WORD`: access time (-u): atime, access, use; metadata change time (-c): ctime, status; modified time (default): mtime, modification; birth time: birth, creation
    - name: time-style
      usage: |
        time/date format with -l, `TIME_STYLE`: full-iso, long-iso, iso, locale, or +FORMAT
    - name: unsorted
      shorthand: U
      default_value: "false"
      usage: do not sort; list entries in directory order
    - name: version
      default_value: "false"
      usage: output version information and exit
    - name: width
      shorthand: w
      usage: set output width to `COLS`; 0 means no limit
example: |4-
      # List the current directory
      lsx

      # Long listing including hidden files, with human-readable sizes
      lsx -lah

      # Newest files first, in the long format
      lsx -lt /var/log

      # Largest files first, with sizes in powers of 1000
      lsx -lS --si downloads/

      # Smallest files first (reverse the size sort)
      lsx -lShr downloads/

      # Recursively list a tree, marking directories and executables
      lsx -RF src/

      # One name per line, directories first, skipping object files
      lsx -1 --group-directories-first -I '*.o' build/

      # List a directory itself rather than its contents, with ISO timestamps
      lsx -ld --time-style=long-iso ~/projects

      # Sort release directories by version number, so v1.10 comes after v1.9
      lsx -v releases/

      # Group files by extension, as a comma-separated list
      lsx -X -m assets/

      # Fill rows across rather than down columns, in at most 60 columns
      lsx -x -w 60 /usr/bin

      # Show inode numbers and allocated blocks, with directories marked by a slash
      lsx -isp

      # Long format with numeric user and group IDs, or without the owner or group columns
      lsx -n data/ && lsx -g data/ && lsx -o data/ && lsx -lG data/

      # Sort by last access time (-u) or status change time (-c), showing that time
      lsx -ltu cache/ && lsx -lt --time=ctime cache/

      # Show complete timestamps, or a custom format
      lsx --full-time notes.txt && lsx -l --time-style=+%Y-%m-%d notes.txt

      # Hide temporary and backup files, unless -a or -A is also given
      lsx -B --hide='*.tmp' work/

      # Quote names, or escape control characters, to spot odd file names
      lsx -Q && lsx -b && lsx -q

      # Follow symbolic links: those named on the command line (-H), or all of them (-L)
      lsx -lH current && lsx -lL lib/

      # List in directory order without sorting, or sort with a word instead of a letter
      lsx -U && lsx --sort=size -l

      # Color by file type and mark types (but not executables) when writing to a terminal
      lsx --color=auto --file-type -C -T 4

      # Count the entries in a directory, hidden ones included
      lsx -A | wcx -l

      # Print the name of the most recently modified file
      lsx -t | headx -n 1

      # Fail a script when an expected file is missing (exit status 2)
      lsx dist/app.js > /dev/null || echox 'build output missing'

      # Run the same listing through the portable gnux shell
      gnux shell -c 'lsx -1 *.log | wcx -l'
