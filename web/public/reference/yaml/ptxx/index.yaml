name: ptxx
synopsis: Produce a permuted index of the words in a text.
description: |-
    ptxx lists every word of the INPUTs (standard input when there are none, or for -) in alphabetical order, each in the middle of a line with the text before it on the left and the text after it on the right: a keyword-in-context index. A word is a run of letters, or what -W's regular expression matches, or what is between -b's break characters; a context ends at the end of a sentence, or where -S says. -i leaves out the words of a file, one per line, and -o keeps only those. -A prefixes each line with FILE:LINE, and -r takes the first word of each input line as its reference; -R puts references on the right. -w sets the width (72), -g the gap between fields (3), -F the mark of a cut context ('/'). -O and -T write roff or TeX macro calls instead (-M names the macro), and -G behaves like System V ptx, with words between blanks, contexts that are lines, roff output, and an optional OUTPUT file. Regular expressions use the Emacs syntax GNU ptx uses, \( \) \| for groups and alternatives, and \1 to \9 for back references.

    EXIT STATUS.
      0  success: every operand was processed
      1  failure: an operand could not be processed (diagnosed on standard error), or a command-line mistake

    HELP. ptxx --help shows the options and the first examples; gnux help ptxx prints the full manual, and gnux help ptxx OPTION explains one option.

    SEE ALSO. sortx, grepx, tsortx.

    PERMISSIONS. Needs read permission on each INPUT and on the -b, -i and -o files; with -G, write permission to create OUTPUT.

    USE CASES.
      - Building a keyword-in-context index for a book or a manual.
      - Seeing every place a word is used in a set of notes, in context.
      - Producing an index for typesetting with roff or TeX.
usage: |-
    ptxx [OPTION]... [INPUT]...   (without -G)
    ptxx -G [OPTION]... [INPUT [OUTPUT]]
options:
    - name: auto-reference
      shorthand: A
      default_value: "false"
      usage: output automatically generated references
    - name: break-file
      shorthand: b
      usage: word break characters in this `FILE`
    - name: flag-truncation
      shorthand: F
      usage: |
        use `STRING` for flagging line truncations. The default is '/'
    - name: format
      usage: |
        generate output as roff or TeX directives: `FORMAT` is roff or tex
    - name: gap-size
      shorthand: g
      usage: gap size in columns between output fields
    - name: help
      default_value: "false"
      usage: display this help and exit
    - name: ignore-case
      shorthand: f
      default_value: "false"
      usage: fold lower case to upper case for sorting
    - name: ignore-file
      shorthand: i
      usage: read ignore word list from `FILE`
    - name: macro-name
      shorthand: M
      usage: macro name to use instead of 'xx'
    - name: only-file
      shorthand: o
      usage: read only word list from this `FILE`
    - name: references
      shorthand: r
      default_value: "false"
      usage: first field of each line is a reference
    - name: right-side-refs
      shorthand: R
      default_value: "false"
      usage: put references at right, not counted in -w
    - name: roff
      shorthand: O
      default_value: "false"
      usage: generate output as roff directives (--format=roff)
    - name: sentence-regexp
      shorthand: S
      usage: for end of lines or end of sentences
    - name: tex
      shorthand: T
      default_value: "false"
      usage: generate output as TeX directives (--format=tex)
    - name: traditional
      shorthand: G
      default_value: "false"
      usage: behave more like System V 'ptx'
    - name: typeset-mode
      shorthand: t
      default_value: "false"
      usage: '- not implemented -'
    - name: version
      default_value: "false"
      usage: output version information and exit
    - name: width
      shorthand: w
      usage: output width in columns, reference excluded
    - name: word-regexp
      shorthand: W
      usage: use `REGEXP` to match each keyword
example: |4-
      # See every word of a text in context
      ptxx notes.txt

      # Index a manual, skipping common words, with file and line references
      ptxx -A -i stopwords.txt chapter*.txt

      # Index only the words that matter
      ptxx -o terms.txt manual.txt

      # Produce TeX macro calls for typesetting
      ptxx -T -M index book.txt > index.tex

      # Treat each line as its own context, ignoring case when sorting
      ptxx -f -S '\n' titles.txt
